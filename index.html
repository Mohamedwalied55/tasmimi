<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تصميمي — تنسيق المذكرات باحترافية</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: '#fdfbf9',
                        charcoal: '#171717',
                        cocoa: '#2b1a07',
                        dew: '#f7efe9',
                        orangeMarker: '#ff6f1e',
                        burntSienna: '#ce500a',
                        skySticker: '#3b82f6',
                        bubblegum: '#ff66cf',
                        sprout: '#22c55e',
                        shadowMist: '#bebcbb',
                    },
                    borderRadius: {
                        'tags': '20px',
                        'cards': '12px',
                        'buttons': '20px',
                        'footer-radius': '56px',
                    },
                    boxShadow: {
                        'custom-lg': 'rgba(0, 0, 0, 0.06) 0px 2px 20px 0px',
                        'custom-subtle': 'rgba(0, 0, 0, 0.25) 0px 1px 2px 0px',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fdfbf9;
            color: #171717;
        }
        .handwritten {
            font-family: cursive, sans-serif;
            color: #ff6f1e;
        }
    </style>
</head>
<body class="bg-cream text-charcoal antialiased selection:bg-orangeMarker selection:text-white">

    <!-- Header -->
    <header class="max-w-[1200px] mx-auto px-6 py-6 flex items-center justify-between">
        <div class="flex items-center gap-3 cursor-pointer" onclick="switchView('home')">
            <div class="w-10 h-10 border-2 border-charcoal rounded-full flex items-center justify-center bg-dew shadow-custom-subtle font-bold text-lg">✏️</div>
            <span class="font-extrabold text-xl text-cocoa tracking-tight">تصميمي</span>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="openOrderModal()" class="border-1.5 border-charcoal bg-cream px-7 py-2.5 rounded-buttons font-medium text-charcoal shadow-custom-subtle hover:bg-dew transition">
                اطلب تنسيق مذكرتك ✨
            </button>
            <button onclick="switchView('admin')" class="border-1.5 border-charcoal bg-cocoa text-cream px-4 py-2.5 rounded-buttons font-medium text-sm shadow-custom-subtle hover:bg-charcoal transition">
                🔒 لوحة الأدمن
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <main id="app-container">
        <!-- سيتم تحميل المحتوى ديناميكياً هنا (الرئيسية أو لوحة الأدمن) -->
    </main>

    <!-- Footer -->
    <footer class="mt-20 bg-orangeMarker text-cream pt-12 pb-12 px-6 rounded-t-[56px] text-center">
        <div class="max-w-[1200px] mx-auto flex flex-col items-center justify-center gap-4">
            <div class="text-2xl font-bold">موقع تصميمي لتنسيق المذكرات المدرسية والجامعية 📚</div>
            <p class="text-dew text-sm">نصنع جمال الأوراق ونرتب أفكارك بعناية فائقة لتبدو مذكرتك كتحفة فنية.</p>
            <div class="text-xs opacity-80 mt-4">جميع الحقوق محفوظة © 2026 تصميمي</div>
        </div>
    </footer>

    <!-- Order Modal -->
    <div id="orderModal" class="fixed inset-0 bg-black/40 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-cream border-2 border-charcoal rounded-cards max-w-lg w-full p-8 shadow-custom-lg relative">
            <button onclick="closeOrderModal()" class="absolute top-4 left-4 text-charcoal font-bold text-xl">✕</button>
            <h3 class="text-2xl font-bold text-cocoa mb-2">طلب تنسيق مذكرّة جديدة 📋</h3>
            <p class="text-sm text-charcoal opacity-85 mb-6">املأ البيانات التالية وسنتواصل معك فوراً لتجهيز مذكرتك.</p>
            <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold mb-1">اسمك الكريم:</label>
                    <input type="text" id="clientName" required class="w-full border-1.5 border-charcoal rounded-inputs p-2.5 bg-dew focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">رقم الهاتف / الواتساب:</label>
                    <input type="text" id="clientPhone" required class="w-full border-1.5 border-charcoal rounded-inputs p-2.5 bg-dew focus:outline-none">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">نوع المادة / الصف الدراسي:</label>
                    <input type="text" id="clientSubject" required class="w-full border-1.5 border-charcoal rounded-inputs p-2.5 bg-dew focus:outline-none" placeholder="مثال: مذكرة احياء الصف الثالث الثانوي">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-1">تفاصيل إضافية أو ملاحظات:</label>
                    <textarea id="clientNotes" rows="3" class="w-full border-1.5 border-charcoal rounded-inputs p-2.5 bg-dew focus:outline-none" placeholder="اكتب أي ألوان أو تصميم تفضله..."></textarea>
                </div>
                <button type="submit" class="w-full border-1.5 border-charcoal bg-orangeMarker text-white font-bold py-3 rounded-buttons shadow-custom-subtle hover:bg-burntSienna transition">
                    إرسال الطلب الآن 🚀
                </button>
            </form>
        </div>
    </div>

    <!-- JavaScript Logic & State Management -->
    <script>
        // Default Data State
        let siteData = {
            heroTitle: "ننسق مذكرتك باحترافية وتصميم مبهر",
            heroSubtitle: "وداعاً للملخصات التقليدية! نحول أوراقك إلى قطع فنية مريحة للعين ومنسقة بعناية فائقة.",
            features: [
                { title: "تصميم غلاف مخصص", desc: "نصمم لك أغطية جذابة بأسماء ملصقات مدرسية أنيقة ومبهجة." },
                { title: "تنسيق احترافي للجداول", desc: "جداول منظمة ورسومات توضيحية تزيد من استيعابك للمادة العلمية." },
                { title: "خطوط مريحة ومدروسة", desc: "استخدام مسافات وعناوين واضحة تضمن لك قراءة ممتعة بدون إجهاد." }
            ],
            orders: [
                { id: 1, name: "أحمد محمد", phone: "01012345678", subject: "مذكرة رياضيات الثانوية العامة", notes: "أريد غلاف باللون الأزرق", status: "قيد العمل", date: "2026-06-01" },
                { id: 2, name: "سارة خالد", phone: "01198765432", subject: "مذكرة لغة إنجليزية الجامعة", notes: "إضافة ملصقات لطيفة", status: "مكتمل", date: "2026-06-02" }
            ]
        };

        // Load from LocalStorage if exists
        if (localStorage.getItem('tasmeemiData')) {
            siteData = JSON.parse(localStorage.getItem('tasmeemiData'));
        }

        function saveData() {
            localStorage.setItem('tasmeemiData', JSON.stringify(siteData));
        }

        // Router / View Switcher
        function switchView(view) {
            const container = document.getElementById('app-container');
            if (view === 'home') {
                container.innerHTML = renderHome();
            } else if (view === 'admin') {
                container.innerHTML = renderAdmin();
            }
            window.scrollTo(0,0);
        }

        // Render Home Page
        function renderHome() {
            return `
                <div class="max-w-[1200px] mx-auto px-6 mt-8">
                    <!-- Hero Section -->
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center py-10">
                        <div class="space-y-6">
                            <span class="handwritten text-xl font-bold bg-dew px-3 py-1 rounded-tags border border-charcoal/20 inline-block">✨ طريقتك الخاصة في المذاكرة</span>
                            <h1 class="text-5xl lg:text-6xl font-extrabold text-cocoa leading-tight tracking-tight">
                                ${siteData.heroTitle}
                            </h1>
                            <p class="text-lg text-charcoal opacity-90 leading-relaxed">
                                ${siteData.heroSubtitle}
                            </p>
                            <div class="pt-4 flex items-center gap-4">
                                <button onclick="openOrderModal()" class="border-1.5 border-charcoal bg-cream px-8 py-3.5 rounded-buttons font-bold text-charcoal shadow-custom-subtle hover:bg-dew transition text-lg">
                                    اطلب تنسيق مذكرتك الآن 🎒
                                </button>
                            </div>
                            <p class="text-sm text-cocoa opacity-75">⚡ جاهزون لتسليم طلبك خلال أقل من 48 ساعة.</p>
                        </div>
                        <div class="relative flex justify-center">
                            <!-- Notebook Hero Card Mockup -->
                            <div class="bg-dew border-2 border-charcoal rounded-cards p-6 shadow-custom-lg max-w-md w-full relative transform rotate-2 hover:rotate-0 transition duration-300">
                                <div class="absolute -top-4 -right-4 bg-skySticker text-white text-xs px-3 py-1 rounded-tags border border-charcoal font-bold rotate-12">مميز جداً ⭐</div>
                                <div class="bg-cream border border-charcoal rounded-lg p-4 mb-4">
                                    <div class="text-xs text-charcoal opacity-60 mb-1">اسم الطالب / Class</div>
                                    <div class="font-bold text-cocoa text-lg">مذكرة التفوق في الفيزياء</div>
                                    <div class="text-xs text-orangeMarker mt-2 font-semibold">تنسيق مخصص بالكامل 📚</div>
                                </div>
                                <div class="space-y-2 text-sm">
                                    <div class="h-3 bg-shadowMist/30 rounded w-full"></div>
                                    <div class="h-3 bg-shadowMist/30 rounded w-5/6"></div>
                                    <div class="h-3 bg-shadowMist/30 rounded w-4/6"></div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Features Section -->
                    <div class="mt-24">
                        <div class="text-center mb-12">
                            <span class="handwritten text-lg font-bold">لماذا تختار خدمة تصميمي؟</span>
                            <h2 class="text-3xl font-bold text-cocoa mt-1">مميزات تجعل مذكرتك مميزة وفريدة</h2>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                            ${siteData.features.map(f => `
                                <div class="bg-dew border-2 border-charcoal rounded-cards p-8 shadow-custom-lg flex flex-col justify-between">
                                    <div>
                                        <div class="w-10 h-10 bg-orangeMarker text-white font-bold rounded-full flex items-center justify-center mb-4 border border-charcoal">✓</div>
                                        <h3 class="text-xl font-bold text-cocoa mb-3">${f.title}</h3>
                                        <p class="text-charcoal opacity-85 leading-relaxed">${f.desc}</p>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Admin Dashboard
        function renderAdmin() {
            return `
                <div class="max-w-[1200px] mx-auto px-6 mt-8">
                    <div class="flex items-center justify-between mb-8 pb-4 border-b border-charcoal/20">
                        <div>
                            <h1 class="text-3xl font-bold text-cocoa">🔒 لوحة تحكم الأدمن</h1>
                            <p class="text-sm text-charcoal opacity-80 mt-1">من هنا يمكنك تعديل محتوى الموقع ومتابعة طلبات العملاء بسهولة.</p>
                        </div>
                        <button onclick="switchView('home')" class="border-1.5 border-charcoal bg-dew px-5 py-2 rounded-buttons font-medium text-charcoal hover:bg-cream transition">
                            ← العودة للموقع الرئيسي
                        </button>
                    </div>

                    <!-- Tabs or Sections -->
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <!-- Left/Top: Edit Site Content -->
                        <div class="lg:col-span-1 bg-dew border-2 border-charcoal rounded-cards p-6 shadow-custom-lg">
                            <h3 class="text-xl font-bold text-cocoa mb-4">⚙️ تعديل نصوص الرئيسية</h3>
                            <form onsubmit="updateHeroContent(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold mb-1">العنوان الرئيسي (Hero Title):</label>
                                    <input type="text" id="editTitle" value="${siteData.heroTitle}" class="w-full border-1.5 border-charcoal rounded-inputs p-2 bg-cream text-sm focus:outline-none">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold mb-1">الوصف الفرعي:</label>
                                    <textarea id="editSubtitle" rows="3" class="w-full border-1.5 border-charcoal rounded-inputs p-2 bg-cream text-sm focus:outline-none">${siteData.heroSubtitle}</textarea>
                                </div>
                                <button type="submit" class="w-full border-1.5 border-charcoal bg-orangeMarker text-white font-bold py-2.5 rounded-buttons text-sm shadow-custom-subtle hover:bg-burntSienna transition">
                                    حفظ التغييرات 💾
                                </button>
                            </form>
                        </div>

                        <!-- Right/Bottom: Manage Orders -->
                        <div class="lg:col-span-2 bg-dew border-2 border-charcoal rounded-cards p-6 shadow-custom-lg">
                            <h3 class="text-xl font-bold text-cocoa mb-4">📦 طلبات العملاء الواردة (${siteData.orders.length})</h3>
                            <div class="overflow-x-auto">
                                <table class="w-full text-right border-collapse">
                                    <thead>
                                        <tr class="border-b-2 border-charcoal text-xs text-cocoa">
                                            <th class="py-2 px-2">العميل</th>
                                            <th class="py-2 px-2">الهاتف</th>
                                            <th class="py-2 px-2">المادة / المذكرة</th>
                                            <th class="py-2 px-2">الحالة</th>
                                            <th class="py-2 px-2">الإجراء</th>
                                        </tr>
                                    </thead>
                                    <tbody class="text-sm">
                                        ${siteData.orders.length === dataIsEmpty() ? `<tr><td colspan="5" class="text-center py-4 opacity-65">لا توجد طلبات حتى الآن.</td></tr>` : 
                                          siteData.orders.map((o, idx) => `
                                            <tr class="border-b border-charcoal/10">
                                                <td class="py-3 px-2 font-bold">${o.name}</td>
                                                <td class="py-3 px-2">${o.phone}</td>
                                                <td class="py-3 px-2">${o.subject}</td>
                                                <td class="py-3 px-2">
                                                    <span class="px-2.5 py-1 rounded-tags text-xs border border-charcoal ${o.status === 'مكتمل' ? 'bg-sprout text-white' : 'bg-orangeMarker text-white'}">${o.status}</span>
                                                </td>
                                                <td class="py-3 px-2 flex gap-2">
                                                    <button onclick="toggleOrderStatus(${idx})" class="text-xs bg-cream border border-charcoal px-2 py-1 rounded hover:bg-dew">تبديل الحالة</button>
                                                    <button onclick="deleteOrder(${idx})" class="text-xs bg-red-500 text-white border border-charcoal px-2 py-1 rounded hover:bg-red-600">حذف</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        function dataIsEmpty() {
            return siteData.orders.length === 0 ? 1 : 0;
        }

        // Modal Controls
        function openOrderModal() {
            document.getElementById('orderModal').classList.remove('hidden');
            document.getElementById('orderModal').classList.add('flex');
        }

        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('flex');
            document.getElementById('orderModal').classList.add('hidden');
        }

        // Submit New Order
        function submitOrder(e) {
            e.preventDefault();
            const name = document.getElementById('clientName').value;
            const phone = document.getElementById('clientPhone').value;
            const subject = document.getElementById('clientSubject').value;
            const notes = document.getElementById('clientNotes').value;

            const newOrder = {
                id: Date.now(),
                name,
                phone,
                subject,
                notes,
                status: "قيد العمل",
                date: new Date().toISOString().split('T')[0]
            };

            siteData.orders.unshift(newOrder);
            saveData();
            closeOrderModal();
            document.getElementById('orderForm').reset();
            alert('تم إرسال طلبك بنجاح! سنتواصل معك قريباً.');
        }

        // Admin: Update Hero Content
        function updateHeroContent(e) {
            e.preventDefault();
            siteData.heroTitle = document.getElementById('editTitle').value;
            siteData.heroSubtitle = document.getElementById('editSubtitle').value;
            saveData();
            alert('تم تحديث محتوى الموقع بنجاح!');
            switchView('admin');
        }

        // Admin: Toggle Order Status
        function toggleOrderStatus(index) {
            siteData.orders[index].status = siteData.orders[index].status === 'قيد العمل' ? 'مكتمل' : 'قيد العمل';
            saveData();
            switchView('admin');
        }

        // Admin: Delete Order
        function deleteOrder(index) {
            if (confirm('هل أنت متأكد من حذف هذا الطلب؟')) {
                siteData.orders.splice(index, 1);
                saveData();
                switchView('admin');
            }
        }

        // Initialize App on load
        window.onload = function() {
            switchView('home');
        };
    </script>
</body>
</html>
