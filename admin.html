<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة التحكم — تصميمي</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background: #fdfbf9; }
    .admin-card { max-width: 600px; margin: 40px auto; background: white; border: 2px solid #171717; border-radius: 12px; padding: 24px; }
    h2 { margin-bottom: 20px; border-bottom: 2px solid #ff6f1e; padding-bottom: 8px; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; }
    input, select { width: 100%; padding: 10px; border: 1.5px solid #171717; border-radius: 8px; }
    .btn-save { background: #ff6f1e; color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 12px; }
  </style>
</head>
<body>
  <div class="admin-card">
    <h2>⚙️ لوحة تحكم المظهر والتخصيص</h2>
    <div class="form-group">
      <label>اللون الرئيسي للموقع:</label>
      <input type="color" id="accentColor" value="#ff6f1e">
    </div>
    <div class="form-group">
      <label>نوع الخط للعنوان الرئيسي:</label>
      <select id="fontSelect">
        <option value="system-ui">افتراضي النظام</option>
        <option value="Cairo">Cairo</option>
        <option value="Tajawal">Tajawal</option>
      </select>
    </div>
    <button class="btn-save" onclick="alert('تم حفظ الإعدادات بنجاح!')">حفظ التغييرات 💾</button>
    <p style="margin-top: 16px; text-align: center;"><a href="/">العودة للموقع الرئيسي</a></p>
  </div>
</body>
</html>
